name: Update WakaTime Stats

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: wakatime-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch WakaTime stats
        run: node scripts/fetch-wakatime.mjs
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/wakatime.json public/wakatime-repos.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update WakaTime stats [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Push rejected, retrying ($i)..."
            sleep $((RANDOM % 5 + 1))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run "Deploy to GitHub Pages"
        env:
          GH_TOKEN: ${{ github.token }}
